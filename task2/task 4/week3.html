<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A student registration form with an events schedule.">
    <meta name="author" content="Raunak Upadhyay">
    <meta name="theme-color" content="#ffffff">
    <title>Register</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <header>
        <h1>Register</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="week3.html" aria-current="page">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Create an Account</h2>
        <form>
            <p>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </p>
            <p>
                <label for="date">Date of birth</label>
                <input type="date" id="date" name="date">
            </p>
            <p>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
            </p>
            <fieldset>
                <legend>Preferred contact method</legend>
                <label for="contact-email">
                    <input type="radio" id="contact-email" name="contact" value="email">
                    Email
                </label>
                <label for="contact-phone">
                    <input type="radio" id="contact-phone" name="contact" value="phone">
                    Phone
                </label>
            </fieldset>
            <fieldset>
                <legend>Interests</legend>
                <label for="interest-coding">
                    <input type="checkbox" id="interest-coding" name="interests" value="coding">
                    Coding
                </label>
                <label for="interest-sports">
                    <input type="checkbox" id="interest-sports" name="interests" value="sports">
                    Sports
                </label>
            </fieldset>
            <p>
                <label for="course">Course</label>
                <select id="course" name="course">
                    <option value="">Select a course</option>
                    <option value="B.tech">B.Tech</option>
                    <option value="BCA">BCA</option>
                    <option value="M.tech">M.Tech</option>
                </select>
            </p>
            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" cols="40"></textarea>
            </p>
            <button type="submit">Submit</button>
        </form>
        <section aria-labelledby="events-heading">
            <h2 id="events-heading">Upcoming Events</h2>
            <table>
                <caption>College events schedule</caption>
                <thead>
                    <tr>
                        <th scope="col">Event</th>
                        <th scope="col">Date</th>
                        <th scope="col">Location</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Welcome On Diwali Night</td>
                        <td>November 6</td>
                        <td>football ground</td>
                    </tr>
                    <tr>
                        <td>Tech Fest</td>
                        <td>december 12</td>
                        <td>Campus Grounds</td>
                    </tr>
                    <tr>
                        <td>Sports Day</td>
                        <td>October 20</td>
                        <td>Sports Complex</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3">3 events scheduled</td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>
</body>
</html>
